troke="#d1d9e0" stroke-width="1"/><text x="13.5" y="335" font-size="14.5" class="f-fg" fill="#1f2328" font-weight="600">Room database</text><text x="13.5" y="355" font-size="12.5" class="f-muted" fill="#59636e">The single source of truth,</text><text x="13.5" y="372" font-size="12.5" class="f-muted" fill="#59636e">15 hand-written migrations</text><rect x="190.5" y="310" width="180" height="76" rx="6" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="203.5" y="335" font-size="14.5" class="f-fg" fill="#1f2328" font-weight="600">Encrypted at rest</text><text x="203.5" y="355" font-size="12.5" class="f-muted" fill="#59636e">SQLCipher, with the key in</text><text x="203.5" y="372" font-size="12.5" class="f-muted" fill="#59636e">the Android Keystore</text><rect x="380.5" y="310" width="180" height="76" rx="6" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="393.5" y="335" font-size="14.5" class="f-fg" fill="#1f2328" font-weight="600">Five home widgets</text><text x="393.5" y="355" font-size="12.5" class="f-muted" fill="#59636e">Start the study timer or</text><text x="393.5" y="372" font-size="12.5" class="f-muted" fill="#59636e">add an expense from home</text><path d="M572.0 348.0 H582.5" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="584.5" y="310" width="175.0" height="76" rx="6" class="n s-border" fill="none" stroke="#d1d9e0" stroke-width="1" stroke-dasharray="4 4"/><text x="597.5" y="335" font-size="14.5" class="f-fg" fill="#1f2328" font-weight="600">Cloud sync</text><text x="597.5" y="355" font-size="12.5" class="f-muted" fill="#59636e">Firebase Auth</text><text x="597.5" y="372" font-size="12.5" class="f-muted" fill="#59636e">and Firestore</text><text x="760" y="406" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="end">Heatmap shading