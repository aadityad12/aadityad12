<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><title id="t">How ApexTracker turns six trackers into one score a day</title><desc id="d">Six trackers (budget, study timer, screen time, reminders, notes, reading queue) feed goals that are checked automatically, such as screen time under 6 hours, study 2 hours, and read one or more papers. The share of goals met shades each day on a heatmap. Everything runs on the phone: a Room database with 15 hand-written migrations, encrypted at rest with SQLCipher under an Android Keystore key, and 5 home-screen widgets. Cloud sync through Firebase is optional.</desc><style>svg{--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--subtle:#f6f8fa;--canvas:#ffffff;--neutral:#818b98;--accent:#0969da;--accent-bg:#ddf4ff;--ok:#1a7f37;--ok-bg:#dafbe1;--warn:#9a6700;--warn-bg:#fff8c5;--danger:#d1242f;--danger-bg:#ffebe9;}@media (prefers-color-scheme:dark){svg{--fg:#f0f6fc;--muted:#9198a1;--border:#3d444d;--subtle:#151b23;--canvas:#0d1117;--neutral:#656c76;--accent:#4493f8;--accent-bg:#121d2f;--ok:#3fb950;--ok-bg:#12261e;--warn:#d29922;--warn-bg:#272115;--danger:#f85149;--danger-bg:#25171c;}}.f-fg{fill:var(--fg)}.s-fg{stroke:var(--fg)}.f-muted{fill:var(--muted)}.s-muted{stroke:var(--muted)}.f-border{fill:var(--border)}.s-border{stroke:var(--border)}.f-subtle{fill:var(--subtle)}.s-subtle{stroke:var(--subtle)}.f-canvas{fill:var(--canvas)}.s-canvas{stroke:var(--canvas)}.f-neutral{fill:var(--neutral)}.s-neutral{stroke:var(--neutral)}.f-accent{fill:var(--accent)}.s-accent{stroke:var(--accent)}.f-accent-bg{fill:var(--accent-bg)}.s-accent-bg{stroke:var(--accent-bg)}.f-ok{fill:var(--ok)}.s-ok{stroke:var(--ok)}.f-ok-bg{fill:var(--ok-bg)}.s-ok-bg{stroke:var(--ok-bg)}.f-warn{fill:var(--warn)}.s-warn{stroke:var(--warn)}.f-warn-bg{fill:var(--warn-bg)}.s-warn-bg{stroke:var(--warn-bg)}.f-danger{fill:var(--danger)}.s-danger{stroke:var(--danger)}.f-danger-bg{fill:var(--danger-bg)}.s-danger-bg{stroke:var(--danger-bg)}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.n{fill:none}</style><text x="0" y="14" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" letter-spacing="1.2">SIX TRACKERS</text><rect x="0.5" y="28" width="168" height="34" rx="6" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="14" y="50" font-size="15" class="f-fg" fill="#1f2328" font-weight="600">Budget</text><rect x="0.5" y="70" width="168" height="34" rx="6" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="14" y="92" font-size="15" class="f-fg" fill="#1f2328" font-weight="600">Study timer</text><rect x="0.5" y="112" width="168" height="34" rx="6" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="14" y="134" font-size="15" class="f-fg" fill="#1f2328" font-weight="600">Screen time</text><rect x="0.5" y="154" width="168" height="34" rx="6" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="14" y="176" font-size="15" class="f-fg" fill="#1f2328" font-weight="600">Reminders</text><rect x="0.5" y="196" width="168" height="34" rx="6" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="14" y="218" font-size="15" class="f-fg" fill="#1f2328" font-weight="600">Notes</text><rect x="0.5" y="238" width="168" height="34" rx="6" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="14" y="260" font-size="15" class="f-fg" fill="#1f2328" font-weight="600">Reading queue</text><text x="258" y="14" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" letter-spacing="1.2">GOALS, CHECKED AUTOMATICALLY</text><rect x="258" y="28" width="232" height="52" rx="6" class="f-ok-bg s-ok" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><circle cx="280" cy="54.0" r="9" class="f-ok" fill="#1a7f37"/><path d="M275.5 54.5 l3.2 3.2 l6 -6.6" class="n s-canvas" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="50" font-size="15" class="f-fg" fill="#1f2328" font-weight="600">Screen time under 6h</text><text x="300" y="68" font-size="12.5" class="f-ok" fill="#1a7f37">Met, read from screen time</text><rect x="258" y="92" width="232" height="52" rx="6" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><circle cx="280" cy="118.0" r="8.5" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5"/><text x="300" y="114" font-size="15" class="f-fg" fill="#1f2328" font-weight="600">Study 2h</text><text x="300" y="132" font-size="12.5" class="f-muted" fill="#59636e">Open, read from study timer</text><rect x="258" y="156" width="232" height="52" rx="6" class="f-ok-bg s-ok" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><circle cx="280" cy="182.0" r="9" class="f-ok" fill="#1a7f37"/><path d="M275.5 182.5 l3.2 3.2 l6 -6.6" class="n s-canvas" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="178" font-size="15" class="f-fg" fill="#1f2328" font-weight="600">Read 1+ papers</text><text x="300" y="196" font-size="12.5" class="f-ok" fill="#1a7f37">Met, read from reading queue</text><rect x="258" y="220" width="232" height="40" rx="6" class="n s-border" fill="none" stroke="#d1d9e0" stroke-width="1" stroke-dasharray="4 4"/><rect x="272" y="232" width="16" height="16" rx="3" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5"/><text x="300" y="245" font-size="14" class="f-muted" fill="#59636e">