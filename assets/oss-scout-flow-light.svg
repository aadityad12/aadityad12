<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
<title id="t">How OSS Scout keeps a human in charge</title>
<desc id="d">Four stages: scan, prepare, review, act. Scan and prepare run unattended and cannot write to GitHub. Only the act stage holds the write token, and it starts only when Aaditya taps approve.</desc>
<rect x="1" y="1" width="958" height="298" rx="16" fill="#f7f3ea" stroke="#d8d0c3" stroke-width="2"/>
<path d="M26 72 V62 H454 V72" fill="none" stroke="#625d54" stroke-width="2"/>
<text x="240.0" y="34" text-anchor="middle" fill="#625d54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="1.6">UNATTENDED</text>
<text x="240.0" y="52" text-anchor="middle" fill="#514d46" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13">No write token. A guard hook blocks every GitHub write.</text>
<path d="M506 72 V62 H694 V72" fill="none" stroke="#625d54" stroke-width="2"/>
<text x="600.0" y="34" text-anchor="middle" fill="#625d54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="1.6">ME</text>
<text x="600.0" y="52" text-anchor="middle" fill="#514d46" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13">Human in the loop</text>
<path d="M746 72 V62 H934 V72" fill="none" stroke="#ef5b2a" stroke-width="2"/>
<text x="840.0" y="34" text-anchor="middle" fill="#ef5b2a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="1.6">WRITE TOKEN</text>
<text x="840.0" y="52" text-anchor="middle" fill="#514d46" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13">Runs only on my tap</text>
<rect x="20" y="86" width="200" height="128" rx="12" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>
<text x="38" y="114" fill="#625d54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">01 SCAN</text>
<text x="38" y="146" fill="#191816" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="-0.4">Find issues</text>
<text x="38" y="172" fill="#514d46" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13.5">Nightly GitHub Action.</text>
<text x="38" y="191" fill="#514d46" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13.5">Plain Python, no AI.</text>
<path d="M226 150.0 H250" stroke="#b8afa1" stroke-width="2.5" fill="none"/>
<path d="M248 144.0 L256 150.0 L248 156.0" stroke="#b8afa1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="260" y="86" width="200" height="128" rx="12" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>
<text x="278" y="114" fill="#625d54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">02 PREPARE</text>
<text x="278" y="146" fill="#191816" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="-0.4">Draft one fix</text>
<text x="278" y="172" fill="#514d46" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13.5">Claude routine drafts</text>
<text x="278" y="191" fill="#514d46" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13.5">one tested fix a night.</text>
<path d="M466 150.0 H490" stroke="#b8afa1" stroke-width="2.5" fill="none"/>
<path d="M488 144.0 L496 150.0 L488 156.0" stroke="#b8afa1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="500" y="86" width="200" height="128" rx="12" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>
<text x="518" y="114" fill="#625d54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">03 REVIEW</text>
<text x="518" y="146" fill="#191816" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="-0.4">I decide</text>
<text x="518" y="172" fill="#514d46" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13.5">Private dashboard.</text>
<text x="518" y="191" fill="#514d46" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13.5">I read it and choose.</text>
<path d="M706 150.0 H730" stroke="#ef5b2a" stroke-width="2.5" fill="none"/>
<path d="M728 144.0 L736 150.0 L728 156.0" stroke="#ef5b2a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="740" y="86" width="200" height="128" rx="12" fill="#fffdf8" stroke="#ef5b2a" stroke-width="2"/>
<text x="758" y="114" fill="#ef5b2a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">04 ACT</text>
<text x="758" y="146" fill="#191816" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="-0.4">Open the PR</text>
<text x="758" y="172" fill="#514d46" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13.5">The only GitHub writer.</text>
<text x="758" y="191" fill="#514d46" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13.5">Re-checks, then posts.</text>
<rect x="674" y="226" width="92" height="26" rx="13" fill="#191816"/>
<circle cx="689" cy="239" r="4" fill="#ef5b2a"/>
<text x="727" y="243.5" text-anchor="middle" fill="#fffdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="0.8">ONE TAP</text>
<path d="M720.0 226 V158.0" stroke="#ef5b2a" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="480.0" y="276" text-anchor="middle" fill="#625d54" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13.5">Status on the public page is read back from GitHub, never self-reported.</text>
</svg>
