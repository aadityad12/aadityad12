<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 246" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><title id="t">How OSS Scout keeps a human in charge</title><desc id="d">Four stages: scan, prepare, review, act. Scan and prepare run unattended and cannot write to GitHub. Only the act stage holds the write token, and it starts only when Aaditya taps approve.</desc><style>svg{--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--subtle:#f6f8fa;--canvas:#ffffff;--neutral:#818b98;--accent:#0969da;--accent-bg:#ddf4ff;--ok:#1a7f37;--ok-bg:#dafbe1;--warn:#9a6700;--warn-bg:#fff8c5;--danger:#d1242f;--danger-bg:#ffebe9;}@media (prefers-color-scheme:dark){svg{--fg:#f0f6fc;--muted:#9198a1;--border:#3d444d;--subtle:#151b23;--canvas:#0d1117;--neutral:#656c76;--accent:#4493f8;--accent-bg:#121d2f;--ok:#3fb950;--ok-bg:#12261e;--warn:#d29922;--warn-bg:#272115;--danger:#f85149;--danger-bg:#25171c;}}.f-fg{fill:var(--fg)}.s-fg{stroke:var(--fg)}.f-muted{fill:var(--muted)}.s-muted{stroke:var(--muted)}.f-border{fill:var(--border)}.s-border{stroke:var(--border)}.f-subtle{fill:var(--subtle)}.s-subtle{stroke:var(--subtle)}.f-canvas{fill:var(--canvas)}.s-canvas{stroke:var(--canvas)}.f-neutral{fill:var(--neutral)}.s-neutral{stroke:var(--neutral)}.f-accent{fill:var(--accent)}.s-accent{stroke:var(--accent)}.f-accent-bg{fill:var(--accent-bg)}.s-accent-bg{stroke:var(--accent-bg)}.f-ok{fill:var(--ok)}.s-ok{stroke:var(--ok)}.f-ok-bg{fill:var(--ok-bg)}.s-ok-bg{stroke:var(--ok-bg)}.f-warn{fill:var(--warn)}.s-warn{stroke:var(--warn)}.f-warn-bg{fill:var(--warn-bg)}.s-warn-bg{stroke:var(--warn-bg)}.f-danger{fill:var(--danger)}.s-danger{stroke:var(--danger)}.f-danger-bg{fill:var(--danger-bg)}.s-danger-bg{stroke:var(--danger-bg)}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.n{fill:none}</style><path d="M1 62 V54 H443 V62" class="n s-muted" fill="none" stroke="#59636e" stroke-width="1.5"/><text x="222.0" y="22" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle" letter-spacing="1.4">UNATTENDED</text><text x="222.0" y="43" font-size="13.5" class="f-muted" fill="#59636e" text-anchor="middle">No write token. A guard hook blocks every GitHub write.</text><path d="M481 62 V54 H683 V62" class="n s-accent" fill="none" stroke="#0969da" stroke-width="1.5"/><text x="582.0" y="22" font-size="12" class="f-accent mono" fill="#0969da" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle" letter-spacing="1.4">ME</text><text x="582.0" y="43" font-size="13.5" class="f-muted" fill="#59636e" text-anchor="middle">A human in the loop</text><path d="M757 62 V54 H959 V62" class="n s-warn" fill="none" stroke="#9a6700" stroke-width="1.5"/><text x="858.0" y="22" font-size="12" class="f-warn mono" fill="#9a6700" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle" letter-spacing="1.4">WRITE TOKEN</text><text x="858.0" y="43" font-size="13.5" class="f-muted" fill="#59636e" text-anchor="middle">Runs only on my tap</text><rect x="0.5" y="76" width="203" height="118" rx="8" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="16" y="102" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.4">01  SCAN</text><text x="16" y="132" font-size="21" class="f-fg" fill="#1f2328" font-weight="600">Find issues</text><text x="16" y="156" font-size="13.5" class="f-muted" fill="#59636e">Nightly GitHub Action.</text><text x="16" y="174" font-size="13.5" class="f-muted" fill="#59636e">Plain Python, no AI.</text><rect x="240.5" y="76" width="203" height="118" rx="8" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="256" y="102" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.4">02  PREPARE</text><text x="256" y="132" font-size="21" class="f-fg" fill="#1f2328" font-weight="600">Draft one fix</text><text x="256" y="156" font-size="13.5" class="f-muted" fill="#59636e">A Claude routine drafts</text><text x="256" y="174" font-size="13.5" class="f-muted" fill="#59636e">one tested fix a night.</text><rect x="480.5" y="76" width="203" height="118" rx="8" class="f-accent-bg s-accent" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="496" y="102" font-size="12" class="f-accent mono" fill="#0969da" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.4">03  REVIEW</text><text x="496" y="132" font-size="21" class="f-fg" fill="#1f2328" font-weight="600">I decide</text><text x="496" y="156" font-size="13.5" class="f-muted" fill="#59636e">Private dashboard.</text><text x="496" y="174" font-size="13.5" class="f-muted" fill="#59636e">I read it and choose.</text><rect x="756.5" y="76" width="203" height="118" rx="8" class="f-warn-bg s-warn" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/><text x="772" y="102" font-size="12" class="f-warn mono" fill="#9a6700" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.4">04  ACT</text><text x="772" y="132" font-size="21" class="f-fg" fill="#1f2328" font-weight="600">Open the PR</text><text x="772" y="156" font-size="13.5" class="f-muted" fill="#59636e">Re-checks the issue and</text><text x="772" y="174" font-size="13.5" class="f-muted" fill="#59636e">the project's rules first.</text><path d="M213 135.0 H231" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5"/><path d="M226 130.5 L232 135.0 L226 139.5" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M453 135.0 H471" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5"/><path d="M466 130.5 L472 135.0 L466 139.5" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M693 135.0 H747" class="n s-ok" fill="none" stroke="#1a7f37" stroke-width="2"/><path d="M742 130.5 L748 135.0 L742 139.5" class="n s-ok" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="689.0" y="101.0" width="62" height="22" rx="11" class="f-ok-bg s-ok" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="720.0" y="116.5" font-size="11" class="f-ok mono" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle" letter-spacing="0.6">ONE TAP</text><text x="0" y="238" font-size="13.5" class="f-muted" fill="#59636e">Status on the public page is read back from GitHub, never self-reported.</text></svg>
