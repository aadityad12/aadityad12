<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><title id="t">Rung's optimization ladder on the fib benchmark</title><desc id="d">Nine rungs from a tree-walking interpreter to a baseline ARM64 JIT, each one the rung below plus one change. Speed on fib relative to the tree-walker: stack VM 3.80x, computed goto 4.53x, NaN-boxing 4.06x (slower than the rung below), register VM 5.71x, superinstructions 5.76x, inline caching 8.41x, constant folding 8.55x, ARM64 JIT 38.84x.</desc><style>svg{--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--subtle:#f6f8fa;--canvas:#ffffff;--neutral:#818b98;--accent:#0969da;--accent-bg:#ddf4ff;--ok:#1a7f37;--ok-bg:#dafbe1;--warn:#9a6700;--warn-bg:#fff8c5;--danger:#d1242f;--danger-bg:#ffebe9;}@media (prefers-color-scheme:dark){svg{--fg:#f0f6fc;--muted:#9198a1;--border:#3d444d;--subtle:#151b23;--canvas:#0d1117;--neutral:#656c76;--accent:#4493f8;--accent-bg:#121d2f;--ok:#3fb950;--ok-bg:#12261e;--warn:#d29922;--warn-bg:#272115;--danger:#f85149;--danger-bg:#25171c;}}.f-fg{fill:var(--fg)}.s-fg{stroke:var(--fg)}.f-muted{fill:var(--muted)}.s-muted{stroke:var(--muted)}.f-border{fill:var(--border)}.s-border{stroke:var(--border)}.f-subtle{fill:var(--subtle)}.s-subtle{stroke:var(--subtle)}.f-canvas{fill:var(--canvas)}.s-canvas{stroke:var(--canvas)}.f-neutral{fill:var(--neutral)}.s-neutral{stroke:var(--neutral)}.f-accent{fill:var(--accent)}.s-accent{stroke:var(--accent)}.f-accent-bg{fill:var(--accent-bg)}.s-accent-bg{stroke:var(--accent-bg)}.f-ok{fill:var(--ok)}.s-ok{stroke:var(--ok)}.f-ok-bg{fill:var(--ok-bg)}.s-ok-bg{stroke:var(--ok-bg)}.f-warn{fill:var(--warn)}.s-warn{stroke:var(--warn)}.f-warn-bg{fill:var(--warn-bg)}.s-warn-bg{stroke:var(--warn-bg)}.f-danger{fill:var(--danger)}.s-danger{stroke:var(--danger)}.f-danger-bg{fill:var(--danger-bg)}.s-danger-bg{stroke:var(--danger-bg)}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.n{fill:none}</style><text x="0" y="18" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" letter-spacing="1.2">RUNG</text><text x="300" y="18" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" letter-spacing="1.2">SPEED ON fib, LOG SCALE</text><text x="826" y="18" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" text-anchor="end" letter-spacing="1.2">VS TREE-WALKER</text><text x="960" y="18" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" text-anchor="end" letter-spacing="1.2">VS RUNG BELOW</text><path d="M300.0 38 V305" class="n s-border" fill="none" stroke="#d1d9e0" stroke-width="1"/><text x="300.0" y="33" font-size="11.5" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">1×</text><path d="M375.2 38 V305" class="n s-border" fill="none" stroke="#d1d9e0" stroke-width="1"/><text x="375.2" y="33" font-size="11.5" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">2×</text><path d="M474.5 38 V305" class="n s-border" fill="none" stroke="#d1d9e0" stroke-width="1"/><text x="474.5" y="33" font-size="11.5" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">5×</t