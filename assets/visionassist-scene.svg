<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><title id="t">How VisionAssist turns a camera frame into one spoken warning</title><desc id="d">A simulated scene in three steps. One: the camera frame, with YOLOv8n boxes around a chair, a cup, a person and a dog. Two: a top view with the wearer on the left and three zones by estimated distance: warning under 6 feet, caution from 6 to 9 feet, safe over 9 feet. The chair at 4.5 feet is the highest-risk object. Three: the device says: Stop. Chair, 2 steps ahead.</desc><style>svg{--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--subtle:#f6f8fa;--canvas:#ffffff;--neutral:#818b98;--accent:#0969da;--accent-bg:#ddf4ff;--ok:#1a7f37;--ok-bg:#dafbe1;--warn:#9a6700;--warn-bg:#fff8c5;--danger:#d1242f;--danger-bg:#ffebe9;}@media (prefers-color-scheme:dark){svg{--fg:#f0f6fc;--muted:#9198a1;--border:#3d444d;--subtle:#151b23;--canvas:#0d1117;--neutral:#656c76;--accent:#4493f8;--accent-bg:#121d2f;--ok:#3fb950;--ok-bg:#12261e;--warn:#d29922;--warn-bg:#272115;--danger:#f85149;--danger-bg:#25171c;}}.f-fg{fill:var(--fg)}.s-fg{stroke:var(--fg)}.f-muted{fill:var(--muted)}.s-muted{stroke:var(--muted)}.f-border{fill:var(--border)}.s-border{stroke:var(--border)}.f-subtle{fill:var(--subtle)}.s-subtle{stroke:var(--subtle)}.f-canvas{fill:var(--canvas)}.s-canvas{stroke:var(--canvas)}.f-neutral{fill:var(--neutral)}.s-neutral{stroke:var(--neutral)}.f-accent{fill:var(--accent)}.s-accent{stroke:var(--accent)}.f-accent-bg{fill:var(--accent-bg)}.s-accent-bg{stroke:var(--accent-bg)}.f-ok{fill:var(--ok)}.s-ok{stroke:var(--ok)}.f-ok-bg{fill:var(--ok-bg)}.s-ok-bg{stroke:var(--ok-bg)}.f-warn{fill:var(--warn)}.s-warn{stroke:var(--warn)}.f-warn-bg{fill:var(--warn-bg)}.s-warn-bg{stroke:var(--warn-bg)}.f-danger{fill:var(--danger)}.s-danger{stroke:var(--danger)}.f-danger-bg{fill:var(--danger-bg)}.s-danger-bg{stroke:var(--danger-bg)}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.n{fill:none}</style><text x="0" y="16" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" letter-spacing="1.2">1  CAMERA FRAME</text><text x="0" y="37" font-size="14" class="f-fg" fill="#1f2328">YOLOv8n, about 200 ms a frame</text><clipPath id="fr"><rect x="26" y="56" width="164" height="291.6" rx="4"/></clipPath><rect x="26" y="56" width="164" height="291.6" rx="4" class="f-subtle" fill="#f6f8fa" stroke-width="1"/><g clip-path="url(#fr)"><path d="M26 78.8 H190" class="n s-border" fill="none" stroke="#d1d9e0" stroke-width="1" stroke-dasharray="4 4"/><rect x="60.8" y="137.6" width="39.2" height="30.8" class="f-ok" fill="#1a7f37" fill-opacity="0.14" stroke="none"/><rect x="60.8" y="137.6" width="39.2" height="30.8" class="n s-ok" fill="none" stroke="#1a7f37" stroke-width="1.5"/><text x="60.8" y="132.6" font-size="10.5" class="f-ok mono" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600">dog 0.79</text><rect x="131.6" y="70.4" width="42.1" height="143.2" class="f-warn" fill="#9a6700" fill-opacity="0.14" stroke="none"/><rect x="131.6" y="70.4" width="42.1" height="143.2" class="n s-warn" fill="none" stroke="#9a6700" stroke-width="1.5"/><text x="185" y="227.6" font-size="10.5" class="f-warn mono" fill="#9a6700" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" text-anchor="end">person 0.88</text><rect x="131.6" y="277.9" width="10.8" height="16.1" class="f-neutral" fill="#818b98" fill-opacity="0.14" stroke="none"/><rect x="131.6" y="277.9" width="10.8" height="16.1" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5"/><text x="185" y="271.9" font-size="10.5" class="f-neutral mono" fill="#818b98" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" text-anchor="end">cup 0.62</text><rect x="28.6" y="183.6" width="74.9" height="134.8" class="f-danger" fill="#d1242f" fill-opacity="0.14" stroke="none"/><rect x="28.6" y="183.6" width="74.9" height="134.8" class="n s-danger" fill="none" stroke="#d1242f" stroke-width="2"/><text x="32.6" y="197.6" font-size="10.5" class="f-danger mono" fill="#d1242f" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600">chair 0.91</text></g><rect x="26" y="56" width="164" height="291.6" rx="4" class="n s-border" fill="none" stroke="#d1d9e0" stroke-width="1.5"/><text x="196" y="82.77777777777777" font-size="11" class="f-muted" fill="#59636e">horizon</text><text x="246" y="16" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" letter-spacing="1.2">2  DISTANCE AND RISK</text><text x="246" y="37" font-size="14" class="f-fg" fill="#1f2328">Distance from box height. Riskiest object first, then nearest.</text><clipPath id="co"><rect x="262" y="111" width="434" height="186"/></clipPath><g clip-path="url(#co)"><rect x="262" y="111" width="434" height="186" class="f-ok-bg" fill="#dafbe1"/><circle cx="262" cy="204" r="279" class="f-warn-bg" fill="#fff8c5"/><circle cx="262" cy="204" r="186" class="f-danger-bg" fill="#ffebe9"/><circle cx="262" cy="204" r="279" class="n s-warn" fill="none" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="262" cy="204" r="186" class="n s-danger" fill="none" stroke="#d1242f" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M262 204 L736 14.4 M262 204 L736 393.6" class="n s-accent" fill="none" stroke="#0969da" stroke-width="1.2"/></g><path d="M262 111 H696 M262 297 H696" class="n s-fg" fill="none" stroke="#1f2328" stroke-width="2"/><text x="342.6" y="87" font-size="11.5" class="f-danger mono" fill="#d1242f" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle" letter-spacing="1">WARNING</text><text x="342.6" y="102" font-size="12" class="f-muted" fill="#59636e" text-anchor="middle">under 6 ft</text><text x="474.4" y="87" font-size="11.5" class="f-warn mono" fill="#9a6700" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle" letter-spacing="1">CAUTION</text><text x="474.4" y="102" font-size="12" class="f-muted" fill="#59636e" text-anchor="middle">6 to 9 ft</text><text x="609.2" y="87" font-size="11.5" class="f-ok mono" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle" letter-spacing="1">SAFE</text><text x="609.2" y="102" font-size="12" class="f-muted" fill="#59636e" text-anchor="middle">over 9 ft</text><path d="M262 297 V303" class="n s-fg" fill="none" stroke="#1f2328" stroke-width="1.5"/><text x="262" y="318" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">0</text><path d="M324 297 V303" class="n s-fg" fill="none" stroke="#1f2328" stroke-width="1.5"/><text x="324" y="318" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">2</text><path d="M386 297 V303" class="n s-fg" fill="none" stroke="#1f2328" stroke-width="1.5"/><text x="386" y="318" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">4</text><path d="M448 297 V303" class="n s-fg" fill="none" stroke="#1f2328" stroke-width="1.5"/><text x="448" y="318" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">6</text><path d="M510 297 V303" class="n s-fg" fill="none" stroke="#1f2328" stroke-width="1.5"/><text x="510" y="318" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">8</text><path d="M572 297 V303" class="n s-fg" fill="none" stroke="#1f2328" stroke-width="1.5"/><text x="572" y="318" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">10</text><path d="M634 297 V303" class="n s-fg" fill="none" stroke="#1f2328" stroke-width="1.5"/><text x="634" y="318" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">12</text><path d="M696 297 V303" class="n s-fg" fill="none" stroke="#1f2328" stroke-width="1.5"/><text x="696" y="318" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">14 ft</text><circle cx="262" cy="204" r="9" class="f-canvas s-fg" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><path d="M271 199 L279 204 L271 209 Z" class="f-fg s-fg" fill="#1f2328" stroke="#1f2328" stroke-width="1"/><text x="247" y="208" font-size="12" class="f-muted" fill="#59636e" text-anchor="end">wearer</text><path d="M279 204 L385.4 179.1" class="n s-danger" fill="none" stroke="#d1242f" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="386.4" y="164.1" width="24" height="24" rx="2" class="f-canvas s-danger" fill="#ffffff" stroke="#d1242f" stroke-width="2.5"/><path d="M386.4 171.1 H410.4" class="n s-danger" fill="none" stroke="#d1242f" stroke-width="2"/><rect x="294.4" y="124.1" width="104.5" height="20" rx="4" class="f-canvas s-danger" fill="#ffffff" stroke="#d1242f" stroke-width="1"/><text x="302.4" y="138.6" font-size="11.5" class="f-danger mono" fill="#d1242f" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="0.6">CHAIR</text><text x="348.9" y="138.6" font-size="11.5" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">4.5 ft</text><ellipse cx="503.8" cy="256.7" rx="7" ry="13" class="f-canvas s-warn" fill="#ffffff" stroke="#9a6700" stroke-width="2"/><circle cx="503.8" cy="256.7" r="5" class="f-canvas s-warn" fill="#ffffff" stroke="#9a6700" stroke-width="2"/><rect x="519.8" y="246.7" width="112.2" height="20" rx="4" class="f-canvas s-warn" fill="#ffffff" stroke="#9a6700" stroke-width="1"/><text x="527.8" y="261.2" font-size="11.5" class="f-warn mono" fill="#9a6700" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="0.6">PERSON</text><text x="582.0" y="261.2" font-size="11.5" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">8.0 ft</text><circle cx="415.5" cy="225.7" r="5" class="f-canvas s-neutral" fill="#ffffff" stroke="#818b98" stroke-width="2"/><circle cx="415.5" cy="225.7" r="1.6" class="f-neutral" fill="#818b98"/><rect x="428.5" y="215.7" width="159.1" height="20" rx="4" class="f-canvas s-neutral" fill="#ffffff" stroke="#818b98" stroke-width="1"/><text x="436.5" y="230.2" font-size="11.5" class="f-neutral mono" fill="#818b98" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="0.6">CUP</text><text x="467.6" y="230.2" font-size="11.5" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">5.0 ft, low risk</text><ellipse cx="630.9" cy="154.4" rx="13" ry="6" class="f-canvas s-ok" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><circle cx="616.9" cy="154.4" r="4" class="f-canvas s-ok" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><rect x="507.8" y="144.4" width="96.1" height="20" rx="4" class="f-canvas s-ok" fill="#ffffff" stroke="#1a7f37" stroke-width="1"/><text x="515.8" y="158.9" font-size="11.5" class="f-ok mono" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="0.6">DOG</text><text x="546.9" y="158.9" font-size="11.5" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">12.0 ft</text><text x="746" y="16" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" letter-spacing="1.2">3  SPEECH</text><text x="746" y="37" font-size="14" class="f-fg" fill="#1f2328">Piper, offline, to earbuds</text><rect x="746" y="78" width="214" height="92" rx="8" class="f-danger-bg s-danger" fill="#ffebe9" stroke="#d1242f" stroke-width="1.5"/><path d="M746 116 l-10 8 l10 8" class="f-danger-bg s-danger" fill="#ffebe9" stroke="#d1242f" stroke-width="1.5" stroke-linejoin="round"/><path d="M746 117.5 V130.5" class="n s-danger-bg" fill="none" stroke="#ffebe9" stroke-width="2.5"/><text x="764" y="115" font-size="21" class="f-fg" fill="#1f2328" font-weight="700">“Stop. Chair,</text><text x="764" y="143" font-size="21" class="f-fg" fill="#1f2328" font-weight="700">2 steps ahead.”</text><text x="746" y="198" font-size="13.5" class="f-muted" fill="#59636e">One announcement at a time,</text><text x="746" y="217" font-size="13.5" class="f-muted" fill="#59636e">in feet and steps.</text><text x="746" y="255" font-size="13.5" class="f-muted" fill="#59636e">Under 6 ft it starts with “stop”.</text><text x="746" y="274" font-size="13.5" class="f-muted" fill="#59636e">The cup is low risk, so it stays</text><text x="746" y="293" font-size="13.5" class="f-muted" fill="#59636e">silent. Past 9 ft, everything does.</text><text x="746" y="318" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Simulated scene</text></svg>
