<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 236" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><title id="t">How Alta finds a fault on a real breadboard</title><desc id="d">Four stages: probes on the student's board, a probe pod running bare-metal C on an Arduino Uno at 1,200 samples a second, a Claude Opus 5.5 agent that measures before it diagnoses, and Cartesia voice with first words in a median 2.57 seconds. Below, a simulated exchange: the yellow probe reads 5.01 volts where about 2 was expected, Alta asks what is between the rail and this row, the student fixes it, and the probe reads 2.01 volts, confirmed with no button press.</desc><style>svg{--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--subtle:#f6f8fa;--canvas:#ffffff;--neutral:#818b98;--accent:#0969da;--accent-bg:#ddf4ff;--ok:#1a7f37;--ok-bg:#dafbe1;--warn:#9a6700;--warn-bg:#fff8c5;--danger:#d1242f;--danger-bg:#ffebe9;}@media (prefers-color-scheme:dark){svg{--fg:#f0f6fc;--muted:#9198a1;--border:#3d444d;--subtle:#151b23;--canvas:#0d1117;--neutral:#656c76;--accent:#4493f8;--accent-bg:#121d2f;--ok:#3fb950;--ok-bg:#12261e;--warn:#d29922;--warn-bg:#272115;--danger:#f85149;--danger-bg:#25171c;}}.f-fg{fill:var(--fg)}.s-fg{stroke:var(--fg)}.f-muted{fill:var(--muted)}.s-muted{stroke:var(--muted)}.f-border{fill:var(--border)}.s-border{stroke:var(--border)}.f-subtle{fill:var(--subtle)}.s-subtle{stroke:var(--subtle)}.f-canvas{fill:var(--canvas)}.s-canvas{stroke:var(--canvas)}.f-neutral{fill:var(--neutral)}.s-neutral{stroke:var(--neutral)}.f-accent{fill:var(--accent)}.s-accent{stroke:var(--accent)}.f-accent-bg{fill:var(--accent-bg)}.s-accent-bg{stroke:var(--accent-bg)}.f-ok{fill:var(--ok)}.s-ok{stroke:var(--ok)}.f-ok-bg{fill:var(--ok-bg)}.s-ok-bg{stroke:var(--ok-bg)}.f-warn{fill:var(--warn)}.s-warn{stroke:var(--warn)}.f-warn-bg{fill:var(--warn-bg)}.s-warn-bg{stroke:var(--warn-bg)}.f-danger{fill:var(--danger)}.s-danger{stroke:var(--danger)}.f-danger-bg{fill:var(--danger-bg)}.s-danger-bg{stroke:var(--danger-bg)}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.n{fill:none}</style><rect x="0.5" y="0.5" width="215" height="112" rx="8" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="16" y="25" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.2">01  STUDENT'S BOARD</text><text x="16" y="54" font-size="21" class="f-fg" fill="#1f2328" font-weight="600">Four probes</text><text x="16" y="78" font-size="13.5" class="f-muted" fill="#59636e">Color-coded probes read</text><text x="16" y="96" font-size="13.5" class="f-muted" fill="#59636e">the real circuit's voltages.</text><rect x="248.5" y="0.5" width="215" height="112" rx="8" class="f-accent-bg s-accent" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="264" y="25" font-size="12" class="f-accent mono" fill="#0969da" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.2">02  PROBE POD, MY PART</text><text x="264" y="54" font-size="21" class="f-fg" fill="#1f2328" font-weight="600">Bare-metal C</text><text x="264" y="78" font-size="13.5" class="f-muted" fill="#59636e">Arduino Uno, no libraries.</text><text x="264" y="96" font-size="13.5" class="f-muted" fill="#59636e">≈1,200 samples a second.</text><path d="M223 56.0 H241" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5"/><path d="M236 51.5 L242 56.0 L236 60.5" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="496.5" y="0.5" width="215" height="112" rx="8" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="512" y="25" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.2">03  AGENT</text><text x="512" y="54" font-size="21" class="f-fg" fill="#1f2328" font-weight="600">Measure first</text><text x="512" y="78" font-size="13.5" class="f-muted" fill="#59636e">Claude Opus 5.5 with tools</text><text x="512" y="96" font-size="13.5" class="f-muted" fill="#59636e">to probe, read, and diagnose.</text><path d="M471 56.0 H489" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5"/><path d="M484 51.5 L490 56.0 L484 60.5" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="744.5" y="0.5" width="215" height="112" rx="8" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="760" y="25" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.2">04  VOICE</text><text x="760" y="54" font-size="21" class="f-fg" fill="#1f2328" font-weight="600">Talks it through</text><text x="760" y="78" font-size="13.5" class="f-muted" fill="#59636e">Cartesia speech. First words</text><text x="760" y="96" font-size="13.5" class="f-muted" fill="#59636e">in a median 2.57 s.</text><path d="M719 56.0 H737" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5"/><path d="M732 51.5 L738 56.0 L732 60.5" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="142" font-size="12" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="600" letter-spacing="1.2">AN EXCHANGE, READINGS SIMULATED</text><rect x="0.5" y="150.5" width="235" height="76" rx="8" class="f-danger-bg s-danger" fill="#ffebe9" stroke="#d1242f" stroke-width="1"/><circle cx="21" cy="171" r="5" class="f-warn" fill="#9a6700"/><text x="33" y="175.5" font-size="11.5" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1">YELLOW PROBE</text><text x="16" y="209" font-size="26" class="f-danger mono" fill="#d1242f" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700">5.01 V</text><text x="122" y="201" font-size="12.5" class="f-muted" fill="#59636e">expected</text><text x="122" y="216" font-size="12.5" class="f-muted" fill="#59636e">about 2 V</text><path d="M243 188.0 H261" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5"/><path d="M256 183.5 L262 188.0 L256 192.5" class="n s-neutral" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="268.5" y="150.5" width="397" height="76" rx="8" class="f-subtle s-border" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="284" y="175.5" font-size="11.5" class="f-accent mono" fill="#0969da" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1">ALTA</text><text x="284" y="198" font-size="15" class="f-fg" fill="#1f2328" font-weight="600">“Yellow reads 5.01 V. You expected about 2.</text><text x="284" y="217" font-size="15" class="f-fg" fill="#1f2328" font-weight="600">What's between the rail and this row?”</text><path d="M673 188.0 H717" class="n s-ok" fill="none" stroke="#1a7f37" stroke-width="2"/><path d="M712 183.5 L718 188.0 L712 192.5" class="n s-ok" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="692.0" y="179.0" font-size="11.5" class="f-muted" fill="#59636e" text-anchor="middle">student</text><text x="692.0" y="207.0" font-size="11.5" class="f-muted" fill="#59636e" text-anchor="middle">fixes it</text><rect x="724.5" y="150.5" width="235" height="76" rx="8" class="f-ok-bg s-ok" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><circle cx="745" cy="171" r="5" class="f-warn" fill="#9a6700"/><text x="757" y="175.5" font-size="11.5" class="f-muted mono" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1">YELLOW PROBE</text><text x="740" y="209" font-size="26" class="f-ok mono" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700">2.01 V</text><text x="846" y="201" font-size="12.5" class="f-muted" fill="#59636e">confirmed, no</text><text x="846" y="216" font-size="12.5" class="f-muted" fill="#59636e">button press</text></svg>
